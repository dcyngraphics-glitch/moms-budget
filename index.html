<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1d23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mom</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Side drawer -->
    <div class="drawer-overlay hidden" id="drawerOverlay"></div>
    <aside class="drawer hidden" id="drawer">
      <div class="drawer-header">
        <h2>Accounts</h2>
        <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
      </div>
      <div class="drawer-list" id="accountList"></div>
      <button class="drawer-add" id="addAccountBtn">+ Add Account</button>
    </aside>

    <!-- Top header -->
    <header class="top-header">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="header-title-wrap">
        <h1 id="headerTitle">BAEAYRAN NA NAMAN</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Dark / Light">🌓</button>
    </header>

    <!-- Main content area -->
    <main id="main-content">
      <!-- Will be populated by JS -->
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-screen="dashboard">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        </span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-screen="income">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </span>
        <span class="nav-label">Income</span>
      </button>
      <button class="nav-item" data-screen="bills">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        </span>
        <span class="nav-label">Bills</span>
      </button>
      <button class="nav-item" data-screen="expenses">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </span>
        <span class="nav-label">Expenses</span>
      </button>
      <button class="nav-item" data-screen="notifications">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </span>
        <span class="nav-label">Alerts</span>
      </button>
      <button class="nav-item" data-screen="statistics">
        <span class="nav-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span>
        <span class="nav-label">Stats</span>
      </button>
    </nav>

    <!-- FAB for quick add -->
    <button class="fab" id="fab" aria-label="Quick actions">+</button>

    <!-- Modal overlay -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="modal" id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Theme toggle — persisted in localStorage
    (function() {
      const THEME_KEY = 'moms-budget-theme';
      const html = document.documentElement;
      
      // Apply saved theme or default to dark
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') {
        html.setAttribute('data-theme', saved);
      } else {
        html.setAttribute('data-theme', 'dark');
      }
      
      // Toggle handler
      const toggle = document.getElementById('themeToggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          const current = html.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          localStorage.setItem(THEME_KEY, next);
        });
      }
    })();
  </script>
  <script>
    // Register service worker for offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(() => {
          console.log('SW registered');
        }).catch(err => {
          console.log('SW failed:', err);
        });
      });
    }
  </script>
</body>
</html>
